<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orçamento Doméstico do Macário</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #17365d;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 500px;
            margin: 30px auto;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .valor {
            font-size: 30px;
            color: #16803c;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Orçamento Doméstico do Macário</h1>

    <div class="card">
        <h2>Bem-vindo ao seu controle financeiro!</h2>

        <p>Seu aplicativo de receitas e despesas.</p>

        <h3>Receita mensal planejada do PROCON</h3>

        <p class="valor">R$ 2.100,00</p>

        <p>Em breve, suas informações serão carregadas automaticamente do Supabase.</p>
    </div>

</body>
</html>
